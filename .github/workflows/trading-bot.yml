# File version: 7.0.0
name: Trading Bot

on:
  schedule:
    # Odd minutes on purpose: GitHub is busiest at the top of the hour.
    - cron: "47 12 * * 1-5"   # morning start, waits for the open
    - cron: "7 18 * * 1-5"    # midday start, takes over from the morning run
  workflow_dispatch:

# Never let two bot runs trade at the same time; a second one waits its turn.
concurrency:
  group: trading-bot
  cancel-in-progress: false

# The bot publishes dashboard data to its own branch, which needs write access.
permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 345   # safety cap, under GitHub's 6-hour limit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # One job runs every strategy. Each strategy trades its own Alpaca paper
      # account, so each has its own pair of keys. A strategy whose keys are
      # missing is skipped and shown as "not set up" on the dashboard.
      - run: python bot.py
        env:
          # RSI Reversion
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID_RSI }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY_RSI }}
          # Opening Range Breakout
          APCA_API_KEY_ID_ORB: ${{ secrets.APCA_API_KEY_ID_ORB }}
          APCA_API_SECRET_KEY_ORB: ${{ secrets.APCA_API_SECRET_KEY_ORB }}
          # RSI(2) Pullback
          APCA_API_KEY_ID_RSI2: ${{ secrets.APCA_API_KEY_ID_RSI2 }}
          APCA_API_SECRET_KEY_RSI2: ${{ secrets.APCA_API_SECRET_KEY_RSI2 }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          # Dashboard data is published to this branch (see publisher.py).
          DASHBOARD_BRANCH: dashboard-data
