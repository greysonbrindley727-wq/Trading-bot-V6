<!doctype html>

<html lang="en">
<head>

<title>Trading Bot Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout concept: one scrolling instrument panel. Account figures lead, then the
   account curve, then the strategy and how it reads each symbol right now, then the
   record of orders, checks and tuning in tabs. */
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --raised: #f1f0ec;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --ink-3: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --accent: #2a78d6;
  --long: #2a78d6;
  --short: #eb6834;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
  --gain: #0ca30c;
  --gain-text: #006300;
  --loss: #d03b3b;
  --loss-text: #d03b3b;
  --warn: #fab219;
  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --raised: #242422;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --ink-3: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --accent: #3987e5;
    --long: #3987e5;
    --short: #d95926;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --gain: #0ca30c;
    --gain-text: #0ca30c;
    --loss: #e66767;
    --loss-text: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface: #1a1a19;
  --raised: #242422;
  --ink: #ffffff;
  --ink-2: #c3c2b7;
  --ink-3: #898781;
  --grid: #2c2c2a;
  --axis: #383835;
  --border: rgba(255, 255, 255, 0.10);
  --accent: #3987e5;
  --long: #3987e5;
  --short: #d95926;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --gain: #0ca30c;
  --gain-text: #0ca30c;
  --loss: #e66767;
  --loss-text: #e66767;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font: 14px/1.45 var(--font);
}
h1, h2, h3, p { margin: 0; }
h1 { font-size: 17px; font-weight: 600; }
h2 { font-size: 15px; font-weight: 600; text-wrap: balance; }
h3 { font-size: 13px; font-weight: 600; }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--ink-2); }
.small { font-size: 12px; }
.mono { font-family: var(--mono); }
.gain { color: var(--gain-text); }
.loss { color: var(--loss-text); }

/* ---- header ---- */
.top { background: var(--page); border-bottom: 1px solid var(--grid); }
.top-in {
  max-width: 1180px; margin: 0 auto; padding: 10px 16px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
}
.brand { display: flex; align-items: baseline; gap: 10px; flex: 1 1 auto; min-width: 0; }
.brand .sub { color: var(--ink-2); font-size: 12px; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.btn, .sel select {
  background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
  padding: 5px 10px; cursor: pointer; min-height: 30px;
}
.btn:hover, .sel select:hover { background: var(--raised); }
.btn[aria-pressed="true"] { border-color: var(--accent); }
.upd { color: var(--ink-2); font-size: 12px; }

.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 56px; display: flex; flex-direction: column; gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; min-width: 0; }
.card-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; margin-bottom: 12px; }
.card-h .sub { color: var(--ink-2); font-size: 12px; }
.grid-2 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); }
.grid-2 > * { min-width: 0; }

/* ---- chips and banners ---- */
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px 2px 7px;
  border-radius: 999px; background: var(--raised); font-size: 12px; font-weight: 500;
  white-space: nowrap; color: var(--ink);
}
.chip .g { color: var(--tone, var(--ink-3)); font-size: 10px; line-height: 1; }
.t-good { --tone: var(--gain); }
.t-bad { --tone: var(--loss); }
.t-warn { --tone: var(--warn); }
.t-long { --tone: var(--long); }
.t-short { --tone: var(--short); }
.t-idle { --tone: var(--ink-3); }
.banner {
  display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px;
  border-radius: 8px; background: var(--raised); border: 1px solid var(--border);
}
.banner .g { color: var(--tone, var(--ink-3)); font-size: 14px; line-height: 1.3; }
.banner b { font-weight: 600; }
.banner .btn { margin-top: 6px; }

/* ---- summary ---- */
.summary { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 900px) { .summary { grid-template-columns: minmax(300px, 1.15fr) 2fr; } }
.stats { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px; min-width: 0; }
.k { color: var(--ink-2); font-size: 12px; }
.v { font-size: 20px; font-weight: 600; margin-top: 2px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.d { color: var(--ink-2); font-size: 12px; margin-top: 2px; }
.hero { display: flex; flex-direction: column; justify-content: center; }
.big { font-size: clamp(34px, 4.4vw, 46px); line-height: 1.05; font-weight: 600; letter-spacing: -0.02em; margin: 4px 0 6px; white-space: nowrap; font-variant-numeric: tabular-nums; }

/* ---- charts ---- */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--grid); margin-bottom: 12px; overflow-x: auto; }
.tabs button {
  background: none; border: 0; padding: 8px 12px; cursor: pointer; color: var(--ink-2);
  border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap;
}
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 500; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.seg button { background: var(--surface); border: 0; padding: 4px 10px; cursor: pointer; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--raised); color: var(--ink); font-weight: 500; }
.chart-host { position: relative; min-height: 120px; }
svg.chart { display: block; width: 100%; height: auto; overflow: visible; }
svg .grid { stroke: var(--grid); stroke-width: 1; }
svg .axisline { stroke: var(--axis); stroke-width: 1; }
svg .ref { stroke: var(--ink-3); stroke-width: 1; }
svg .tick { fill: var(--ink-3); font-size: 11px; font-family: var(--font); }
svg .reflabel { fill: var(--ink-2); font-size: 11px; font-family: var(--font); }
svg .ln { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
svg .area { fill: var(--accent); opacity: 0.10; }
svg .dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
svg .cross { stroke: var(--ink-3); stroke-width: 1; }
svg .endlabel { fill: var(--ink); font-size: 12px; font-weight: 600; font-family: var(--font); }
svg .bar-up { fill: var(--gain); }
svg .bar-down { fill: var(--loss); }
svg .bar-hot { filter: brightness(1.15); }
svg .hit { fill: transparent; }
.tip {
  position: absolute; top: 0; pointer-events: none; z-index: 5; min-width: 120px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
  padding: 6px 10px; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12); transform: translateX(-50%);
}
.tip-v { font-weight: 600; font-size: 14px; }
.tip-s { color: var(--ink-2); font-size: 11px; }
.tip-d { font-size: 12px; margin-top: 2px; }
.empty { color: var(--ink-2); padding: 28px 8px; text-align: center; }
details.data { margin-top: 10px; }
details.data summary { cursor: pointer; color: var(--ink-2); font-size: 12px; }
.delta { font-weight: 500; }

/* ---- strategy ---- */
.strat { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); }
.strat > * { min-width: 0; }
.rules { margin: 8px 0 0; padding-left: 18px; color: var(--ink-2); }
.rules li { margin: 3px 0; }
.kv { width: 100%; border-collapse: collapse; }
.kv th, .kv td { padding: 6px 0; border-bottom: 1px solid var(--grid); text-align: left; vertical-align: top; }
.kv th { font-weight: 400; color: var(--ink-2); padding-right: 12px; }
.kv td { font-weight: 500; white-space: nowrap; }
.kv .hint { display: block; font-weight: 400; color: var(--ink-3); font-size: 11px; white-space: normal; }
.syms { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.sym-chip { font-family: var(--mono); font-size: 12px; background: var(--raised); border-radius: 4px; padding: 2px 7px; }

/* ---- market read ---- */
.symcards { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
.symcard { border: 1px solid var(--border); border-radius: 8px; padding: 14px; background: var(--surface); min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.sc-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.sc-sym { font-family: var(--mono); font-weight: 500; font-size: 17px; }
.sc-price { font-weight: 600; font-size: 15px; }
.gauge-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-2); }
.gauge-row b { color: var(--ink); font-weight: 600; }
.gauge { position: relative; height: 8px; border-radius: 4px; background: var(--raised); margin: 4px 0 24px; }
.gauge .zone { position: absolute; top: 0; bottom: 0; background: var(--accent); opacity: 0.22; }
.gauge .mk { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--ink-3); }
.gauge .mk span { position: absolute; top: 100%; left: 0; transform: translateX(-50%); margin-top: 3px; font-size: 11px; color: var(--ink-3); white-space: nowrap; }
.gauge .gdot { position: absolute; top: 50%; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--surface); transform: translate(-50%, -50%); }
.checks { display: flex; flex-direction: column; gap: 4px; margin: 0; padding: 0; list-style: none; }
.checks li { display: flex; gap: 8px; align-items: baseline; font-size: 12.5px; color: var(--ink-2); }
.checks .on { color: var(--ink); }
.checks .mark { width: 14px; flex: none; text-align: center; color: var(--ink-3); font-weight: 600; }
.checks .on .mark { color: var(--accent); }
.reason { font-size: 13px; color: var(--ink); }
.spark { min-height: 56px; }
.stamp { color: var(--ink-3); font-size: 11px; }

/* ---- tables ---- */
.tablewrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th { text-align: left; font-weight: 500; color: var(--ink-2); padding: 6px 10px 6px 0; border-bottom: 1px solid var(--axis); white-space: nowrap; }
table.t td { padding: 7px 10px 7px 0; border-bottom: 1px solid var(--grid); vertical-align: top; }
table.t .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.t td.nowrap, table.t th.nowrap { white-space: nowrap; }
table.t td.why { min-width: 220px; color: var(--ink-2); }
table.t tbody tr:last-child td { border-bottom: 0; }
.subhead { margin: 18px 0 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.subhead:first-child { margin-top: 0; }
.filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }

.foot { color: var(--ink-3); font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 16px; }
.foot a { color: var(--ink-2); }
.loading { opacity: 0.6; transition: opacity 0.15s; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ---- strategy switcher ---- */
.viewbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--page); border-bottom: 1px solid var(--grid);
}
.viewbar-in { max-width: 1180px; margin: 0 auto; padding: 8px 16px; display: flex; align-items: center; gap: 12px; }
.views { display: flex; gap: 6px; overflow-x: auto; flex: 1 1 auto; min-width: 0; padding: 2px 0; scrollbar-width: thin; }
.views button {
  display: inline-flex; align-items: center; gap: 8px; flex: none; white-space: nowrap; min-height: 34px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 5px 14px; cursor: pointer;
}
.views button:hover { background: var(--raised); }
.views button[aria-selected="true"] { border-color: var(--ink); background: var(--raised); font-weight: 500; }
.viewbar-in #health { flex: none; }
.swatch { display: inline-block; flex: none; width: 18px; height: 3px; border-radius: 2px; background: var(--c, var(--accent)); }
.swatch.dot { width: 10px; height: 10px; border-radius: 50%; }
.topbar { background: var(--page); }
@media (max-width: 560px) { .viewbar-in #health { display: none; } }

/* ---- compare view ---- */
.legend { display: flex; flex-wrap: wrap; gap: 6px 20px; margin-bottom: 10px; }
.legend-item { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; }
.legend-item b { font-weight: 600; font-variant-numeric: tabular-nums; }
svg .cl { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
svg .cdot { stroke: var(--surface); stroke-width: 2; }
svg .endnum { fill: var(--ink); font-size: 12px; font-weight: 600; font-family: var(--font); }
.tip-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 12px; margin-top: 4px; white-space: nowrap; }
.tip-row .nm { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }
.tip-row .vv { font-weight: 600; font-variant-numeric: tabular-nums; }
.scards { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.scard { border: 1px solid var(--border); border-radius: 8px; padding: 14px; background: var(--surface); min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.scard-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.scard h3 { display: flex; align-items: center; gap: 8px; }
.scard .nums { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
.scard .nums .v { font-size: 16px; }
.scard .sched { color: var(--ink-2); font-size: 12px; }
table.cmp { max-width: 860px; }

.cmp th.colh { text-align: right; vertical-align: bottom; white-space: normal; min-width: 92px; }
.cmp th.colh .swatch { display: block; margin: 0 0 5px auto; }
.cmp td.rowh { color: var(--ink-2); white-space: normal; min-width: 96px; }
.cmp td.rowh .hint { display: block; color: var(--ink-3); font-size: 11px; }
.cmp td.na { color: var(--ink-3); }
.setup-steps { margin: 8px 0 0; padding-left: 20px; color: var(--ink-2); }
.setup-steps li { margin: 4px 0; }
.code { font-family: var(--mono); font-size: 12px; background: var(--raised); border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
@media (max-width: 560px) {
  table.cmp { font-size: 12px; }
  .cmp th.colh, .cmp td.rowh { min-width: 0; }
  .cmp td.rowh .hint { display: none; }
  table.t.cmp th, table.t.cmp td { padding-right: 6px; }
}
</style>
</head>

<header class="top">
  <div class="top-in">
    <div class="brand"><h1>Trading Bot</h1><span class="sub" id="brand-sub">Paper accounts</span></div>
    <div class="controls">
      <span class="upd" id="updated"></span>
      <button class="btn" id="refresh" type="button">Refresh</button>
      <button class="btn" id="auto" type="button" aria-pressed="true">Auto-refresh on</button>
      <button class="btn" id="demo" type="button" aria-pressed="false">Sample data</button>
      <button class="btn" id="theme" type="button">Theme: auto</button>
    </div>
  </div>
</header>
<nav class="viewbar" aria-label="Strategy view">
  <div class="viewbar-in">
    <div class="views" id="views" role="tablist"></div>
    <span id="health"></span>
  </div>
</nav>
<main class="wrap" id="app"><p class="empty">Loading…</p></main>
<noscript><p class="empty">This dashboard needs JavaScript.</p></noscript>

<script>
(() => {
"use strict";

/* ======================= configuration ======================= */
const CONFIG = {
  owner: "greysonbrindley727-wq",
  repo: "Trading-bot-V6",
  dataBranch: "dashboard-data",   // where the bot publishes its data files
  mainBranch: "main",             // where tuning_log.csv lives
  refreshSeconds: 60,
  staleMinutes: 15,               // "no heartbeat" if the bot says it's running but hasn't reported for this long
};
const params = new URLSearchParams(location.search);
const IS_PAGES = /\.github\.io$/i.test(location.hostname);
if (IS_PAGES) {
  CONFIG.owner = location.hostname.split(".")[0];
  const seg = location.pathname.split("/")[1];
  if (seg) CONFIG.repo = seg;
}
const RAW = "https://raw.githubusercontent.com/" + CONFIG.owner + "/" + CONFIG.repo;
const DATA_BASE = params.get("data") || RAW + "/" + CONFIG.dataBranch;   // ?data= lets you point at test files
const MAIN_BASE = params.get("main") || RAW + "/" + CONFIG.mainBranch;
const LIVE_CAPABLE = IS_PAGES || params.has("data");

/* ======================= small helpers ======================= */
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
const $ = (sel) => document.querySelector(sel);
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const SVGNS = "http://www.w3.org/2000/svg";
function sv(tag, attrs) {
  const el = document.createElementNS(SVGNS, tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

const usd0 = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });
const usd2 = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", minimumFractionDigits: 2, maximumFractionDigits: 2 });
const bad = (n) => n == null || Number.isNaN(n);
const money = (n, d = 2) => bad(n) ? "–" : (d === 0 ? usd0 : usd2).format(n);
const smoney = (n, d = 2) => bad(n) ? "–" : (n > 0 ? "+" : n < 0 ? "−" : "") + (d === 0 ? usd0 : usd2).format(Math.abs(n));
const spct = (n, d = 2) => bad(n) ? "–" : (n > 0 ? "+" : n < 0 ? "−" : "") + Math.abs(n).toFixed(d) + "%";
const tone = (n) => bad(n) || n === 0 ? "" : n > 0 ? "gain" : "loss";
const arrow = (n) => bad(n) || n === 0 ? "" : n > 0 ? "▲ " : "▼ ";
const num = (n, d = 0) => bad(n) ? "–" : Number(n).toLocaleString("en-US", { maximumFractionDigits: d });

const ET = "America/New_York";

function dailyPnl(pts, start) {
  const days = [];
  let cur = null;
  for (const p of pts) {
    const k = etKey(p.t);
    if (!cur || cur.key !== k) { cur = { key: k, t: p.t, close: p.v }; days.push(cur); }
    cur.close = p.v; cur.t = p.t;
  }
  let prev = start != null ? start : (pts[0] ? pts[0].v : 0);
  return days.map((d) => { const pnl = d.close - prev; prev = d.close; return { key: d.key, label: fDay.format(d.t), v: pnl, close: d.close, t: d.t }; });
}
function bySymbol(decisions) {
  const latest = {}, hist = {};
  for (const d of decisions) {
    latest[d.symbol] = d;
    (hist[d.symbol] = hist[d.symbol] || []).push(d);
  }
  for (const k of Object.keys(hist)) hist[k] = hist[k].slice(-90);
  return { latest, hist };
}
function isConfigured(e) {
  const st = e.status && e.status.bot && e.status.bot.state;
  return st !== "not_configured" && e.meta.configured !== false;
}
const entriesOf = (m) => m.strategies.map((s) => m.byId[s.id]).filter(Boolean);
const activeEntries = (m) => entriesOf(m).filter(isConfigured);
const SERIES_MAX = 8;
const colorVar = (i) => "var(--s" + (Math.min(Math.max(i, 0), SERIES_MAX - 1) + 1) + ")";
const colorOf = (m, id) => colorVar(m.strategies.findIndex((s) => s.id === id));
const nameOf = (m, id) => { const s = m.strategies.find((x) => x.id === id); return s ? (s.name || s.id) : id; };

function healthOf(e) {
  const b = e.status.bot || {}, upd = Date.parse(e.status.updated_at), age = Date.now() - upd;
  const stale = !Number.isNaN(upd) && age > CONFIG.staleMinutes * 60000;
  const quiet = { tone: "warn", glyph: "!", label: "No heartbeat", detail: "The bot last reported " + ago(upd) + " but says it is still running. The run may have been cancelled or crashed. Open the run log to check." };
  if (!isConfigured(e)) return { tone: "idle", glyph: "○", label: "Not set up", detail: b.message };
  switch (b.state) {
    case "running": return stale ? quiet : { tone: "good", glyph: "●", label: "Running", detail: b.message };
    case "waiting": return stale ? quiet : { tone: "good", glyph: "●", label: "Waiting for open", detail: b.message };
    case "starting": return stale ? quiet : { tone: "good", glyph: "●", label: "Starting", detail: b.message };
    case "error": return { tone: "bad", glyph: "✕", label: "Errors", detail: (b.last_error || b.message) };
    case "halted": return { tone: "warn", glyph: "!", label: "Halted", detail: b.message };
    default: return { tone: "idle", glyph: "○", label: "Idle", detail: b.message };
  }
}
// One chip for the whole page: the worst state among the strategies that are switched on.
function healthAll(m) {
  const act = activeEntries(m);
  if (!act.length) return { tone: "idle", glyph: "○", label: "Nothing switched on", detail: "" };
  const hs = act.map(healthOf), rank = { bad: 3, warn: 2, good: 1, idle: 0 };
  const worst = hs.reduce((a, b) => (rank[b.tone] > rank[a.tone] ? b : a));
  if (worst.tone === "bad" || worst.tone === "warn") {
    const n = hs.filter((x) => x.tone === worst.tone).length;
    return { tone: worst.tone, glyph: worst.glyph, label: n > 1 ? n + " need attention" : worst.label, detail: worst.detail };
  }
  const running = hs.filter((x) => x.tone === "good").length;
  return running ? { tone: "good", glyph: "●", label: running === hs.length ? "All running" : running + " of " + hs.length + " running", detail: "" } : { tone: "idle", glyph: "○", label: "Idle", detail: "" };
}

function tradeStats(trades) {
  const n = trades.length;
  const wins = trades.filter((t) => t.pnl > 0), losses = trades.filter((t) => t.pnl < 0);
  const gw = wins.reduce((s, t) => s + t.pnl, 0), gl = -losses.reduce((s, t) => s + t.pnl, 0);
  return {
    n, wins: wins.length, losses: losses.length,
    winRate: n ? wins.length / n * 100 : null,
    total: trades.reduce((s, t) => s + (t.pnl || 0), 0),
    avgWin: wins.length ? gw / wins.length : null,
    avgLoss: losses.length ? -gl / losses.length : null,
    profitFactor: gl > 0 ? gw / gl : (gw > 0 ? Infinity : null),
  };
}
function maxDrawdown(pts) {
  if (!pts.length) return null;
  let peak = -Infinity, worst = 0;
  for (const p of pts) { peak = Math.max(peak, p.v); worst = Math.min(worst, (p.v - peak) / peak * 100); }
  return worst;
}

// The period being compared. "day" is the latest session; "all" starts on the first moment every
// switched-on account had data, so the lines are compared from the same start.
function periodOf(m, range) {
  const act = activeEntries(m).filter((e) => e.equity.length);
  if (!act.length) return null;
  if (range === "day") {
    const key = etKey(Math.max(...act.map((e) => e.equity[e.equity.length - 1].t)));
    const start = Math.min(...act.flatMap((e) => e.equity.filter((p) => etKey(p.t) === key).map((p) => p.t)));
    return { range, key, start, label: key === etKey(Date.now()) ? "Today" : "Last session" };
  }
  const start = Math.max(...act.map((e) => e.equity[0].t));
  return { range, start, label: "Since " + fDay.format(start) };
}
function sliceFor(e, period) {
  const pts = e.equity, day = period.range === "day";
  let baseIdx = -1;
  for (let i = 0; i < pts.length; i++) { if (day ? pts[i].t < period.start : pts[i].t <= period.start) baseIdx = i; else break; }
  const inside = pts.filter((p) => day ? (etKey(p.t) === period.key && p.t >= period.start) : p.t >= period.start);
  const base = baseIdx >= 0 ? pts[baseIdx] : inside[0] || pts[0];
  return { base, inside };
}
function tradesIn(e, period) {
  return e.trades.filter((t) => { const ms = Date.parse(t.t); return period.range === "day" ? etKey(ms) === period.key : ms >= period.start; });
}

// Build the overlay lines: every strategy as percent return from its own value at the common start.
function buildCompare(m, period) {
  const act = activeEntries(m).filter((e) => e.equity.length), parts = act.map((e) => ({ e, ...sliceFor(e, period) }));
  const set = new Set();
  parts.forEach((p) => p.inside.forEach((q) => set.add(q.t)));
  let ts = Array.from(set).sort((a, b) => a - b);
  if (ts.length > 400) { const k = Math.ceil(ts.length / 400); ts = ts.filter((_, i) => i % k === 0 || i === ts.length - 1); }
  const series = parts.map((p) => {
    let j = -1;
    const pts = ts.map((t) => {
      while (j + 1 < p.inside.length && p.inside[j + 1].t <= t) j++;
      const val = j >= 0 ? p.inside[j].v : p.base.v;
      return { t, val, pct: (val / p.base.v - 1) * 100 };
    });
    return { id: p.e.meta.id, name: p.e.meta.name || p.e.meta.id, color: colorOf(m, p.e.meta.id), pts, base: p.base.v };
  });
  return { ts, series };
}

function drawBars(host, rows, o) {

  if (!n) { host.append(emptyNote(o.empty)); return; }
  const W = Math.max(260, Math.floor(host.clientWidth)), H = 260, m = { l: 66, r: 12, t: 22, b: 28 };
  const vs = rows.map((r) => r.v);
  const { ticks, lo, hi, step } = niceTicks(Math.min(0, ...vs), Math.max(0, ...vs), 4);
  const Y = (v) => m.t + (1 - (v - lo) / (hi - lo)) * (H - m.t - m.b);
  const band = (W - m.l - m.r) / n, bw = Math.min(24, band * 0.62);

  ticks.forEach((t) => {
    const y = Y(t);

    const tx = sv("text", { x: m.l - 8, y: y + 4, class: "tick", "text-anchor": "end" });
    tx.textContent = fmtTick(t, step);

  });
  const every = n <= 8 ? 1 : n <= 16 ? 2 : 3;
  const tip = h("div", { class: "tip", hidden: true });
  const y0 = Y(0), r4 = 4;
  rows.forEach((r, i) => {

    const up = r.v >= 0, hgt = Math.max(1, Math.abs(y1 - y0)), rr = Math.min(r4, hgt / 2);
    const yTop = up ? y0 - hgt : y0, yBot = up ? y0 : y0 + hgt;
    const d = up
      ? "M" + x + "," + yBot + "L" + x + "," + (yTop + rr) + "Q" + x + "," + yTop + " " + (x + rr) + "," + yTop + "L" + (x + bw - rr) + "," + yTop + "Q" + (x + bw) + "," + yTop + " " + (x + bw) + "," + (yTop + rr) + "L" + (x + bw) + "," + yBot + "Z"
      : "M" + x + "," + yTop + "L" + x + "," + (yBot - rr) + "Q" + x + "," + yBot + " " + (x + rr) + "," + yBot + "L" + (x + bw - rr) + "," + yBot + "Q" + (x + bw) + "," + yBot + " " + (x + bw) + "," + (yBot - rr) + "L" + (x + bw) + "," + yTop + "Z";
    const bar = sv("path", { d, class: up ? "bar-up" : "bar-down" });
    svg.append(bar);
    if ((n - 1 - i) % every === 0) {
      const tx = sv("text", { x: cx, y: H - 8, class: "tick", "text-anchor": "middle" });
      tx.textContent = r.label;
      svg.append(tx);
    }
    if (i === n - 1) {
      const lx = Math.min(Math.max(cx, m.l + 24), W - m.r - 24);
      const lab = sv("text", { x: lx, y: up ? y1 - 6 : y1 + 14, class: "endlabel", "text-anchor": "middle" });
      lab.textContent = smoney(r.v, 0);
      svg.append(lab);

    const on = () => {
      bar.classList.add("bar-hot");
      tip.replaceChildren(
        h("div", { class: "tip-v " + tone(r.v), text: arrow(r.v) + smoney(r.v) }),
        h("div", { class: "tip-s", text: r.label + (r.partial ? " (in progress)" : "") }),

    svg.append(hit);
  });

}

// Alpaca errors arrive as JSON text like {"code":40310000,"message":"asset MSFT cannot be sold short"}.
// Show just the readable part.
function plainMessage(text) {
  if (!text) return "";
  let t = String(text).trim();
  try {
    const j = JSON.parse(t);
    if (j && j.message) t = String(j.message);
  } catch (e) { /* not JSON, keep as is */ }
  t = t.charAt(0).toUpperCase() + t.slice(1);
  return /[.!?]$/.test(t) ? t : t + ".";
}

function drawCompare(host, cmp, o) {

function thin(list, max) {
  if (list.length <= max) return list;

  t.append(h("thead", null, h("tr", null, h("th", { text: "" }), cols.map((c) => h("th", { class: "colh" }, swatchEl(colorOf(m, c.e.meta.id)), c.e.meta.name || c.e.meta.id)))));
  t.append(h("tbody", null, rows.map(([label, hint, f]) => h("tr", null, h("td", { class: "rowh" }, label, hint ? h("span", { class: "hint", text: hint }) : null), cols.map((c) => h("td", { class: "num" }, f(c)))))));
  return card("Side by side", period.range === "day" ? period.label : "From " + stamp(period.start), cols.length ? h("div", { class: "tablewrap" }, t) : emptyNote("No strategies are switched on yet."));
}

function renderStrategyCards(m) {
  const cards = entriesOf(m).map((e) => {
    const hl = healthOf(e), a = e.status.account || {}, st = e.status.strategy || e.meta, on = isConfigured(e);
    const total = !bad(a.equity) && !bad(a.starting_equity) ? a.equity - a.starting_equity : null;
    const num2 = (k, v, cls) => h("div", null, h("div", { class: "k", text: k }), h("div", { class: "v " + (cls || ""), text: v }));
    return h("div", { class: "scard" },
      h("div", { class: "scard-top" }, h("h3", null, swatchEl(colorOf(m, e.meta.id)), e.meta.name || e.meta.id), chip(hl.label, hl.tone, hl.glyph)),
      h("p", { class: "sched", text: st.schedule || st.timeframe || "" }),
      on ? h("div", { class: "nums" },
        num2("Account value", money(a.equity, 0)),
        num2("Today", arrow(a.day_pnl) + smoney(a.day_pnl, 0), tone(a.day_pnl)),
        num2("Since start", arrow(total) + smoney(total, 0), tone(total)),
        num2("Open positions", String((e.status.positions || []).length)))
        : h("p", { class: "small muted", text: (e.status.bot && e.status.bot.message) || "No API keys yet." }),
      h("div", null, h("button", { class: "btn", type: "button", onclick: () => setView(e.meta.id) }, on ? "Open details" : "How to switch it on")));
  });
  return card("The strategies", "Each one trades its own paper account", h("div", { class: "scards" }, cards));
}

function renderCompareTrades(m) {
  const all = entriesOf(m).flatMap((e) => e.trades.map((t) => ({ ...t, sid: e.meta.id }))).sort((a, b) => Date.parse(b.t) - Date.parse(a.t)).slice(0, 40);
  return card("Recent closed trades", "All strategies, newest first", all.length ? tradesTable(all, m) : emptyNote("No trades have closed yet. Each one appears here after its position is gone."));
}

function renderCompareView(m) {
  const period = periodOf(m, ui.range), out = renderBanners(entriesOf(m), m.demo);
  out.push(renderCompareSummary(m));
  if (period) out.push(renderCompareChart(m, period), renderCompareTable(m, period));
  else out.push(card("Compare strategies", null, emptyNote("No account history yet. A point is recorded about every 5 minutes while the market is open.")));
  out.push(renderStrategyCards(m), renderCompareTrades(m), renderFoot(m));
  return out;
}

function renderSingleView(m, e) {
  const out = renderBanners([e], m.demo);
  if (!isConfigured(e)) { out.push(renderNotSetUp(m, e), renderStrategy(e), renderFoot(m, e)); return out; }
  out.push(renderSummary(e), h("div", { class: "grid-2" }, renderCurve(e), renderDaily(e)), renderStrategy(e), renderRead(e), renderPositions(e), renderActivity(e), renderFoot(m, e));
  return out;
}

/* ======================= page ======================= */
function renderViews() {
  const m = model, box = $("#views");
  if (!m) { box.replaceChildren(); return; }
  const tabs = [];
  if (m.strategies.length > 1) tabs.push({ id: "compare", label: "Compare", node: h("span", { class: "g", "aria-hidden": "true", text: "≈" }) });
  m.strategies.forEach((s, i) => tabs.push({ id: s.id, label: s.name || s.id, node: swatchEl(colorVar(i)) }));
  box.replaceChildren(...tabs.map((t) => h("button", { type: "button", role: "tab", "aria-selected": String(ui.view === t.id), onclick: () => setView(t.id) }, t.node, t.label)));
}
function renderHeader() {
  const m = model;
  $("#brand-sub").textContent = !m ? "Paper accounts" : ui.view === "compare" ? activeEntries(m).length + " paper accounts" : "Paper account · " + nameOf(m, ui.view);
  renderViews();
  const e = m && ui.view !== "compare" ? m.byId[ui.view] : null;
  const hl = m ? (e ? healthOf(e) : healthAll(m)) : null, hs = $("#health");
  hs.replaceChildren(...(hl ? [chip(hl.label, hl.tone, hl.glyph)] : []));
  hs.title = hl && hl.detail ? hl.detail : "";
  updateAgo();
  $("#auto").setAttribute("aria-pressed", String(ui.auto));
  $("#auto").textContent = ui.auto ? "Auto-refresh on" : "Auto-refresh off";
  $("#demo").setAttribute("aria-pressed", String(ui.demo));
  $("#demo").hidden = !LIVE_CAPABLE;
  $("#theme").hidden = !LIVE_CAPABLE;
  $("#theme").textContent = "Theme: " + ui.theme;
}
function updateAgo() {
  const el = $("#updated");
  if (!model || model.demo) { el.textContent = ""; return; }
  const times = activeEntries(model).map((e) => Date.parse(e.status.updated_at)).filter((x) => !Number.isNaN(x));
  el.textContent = times.length ? "Bot reported " + ago(Math.max(...times)) : "";
}

function render() {
  charts = [];
  if (!model) {
    app.replaceChildren(lastError ? renderEmpty(lastError) : h("p", { class: "empty", text: "Loading…" }));
    renderHeader();
    return;
  }
  const body = ui.view === "compare" && model.strategies.length > 1 ? renderCompareView(model) : renderSingleView(model, model.byId[ui.view] || entriesOf(model)[0]);
  app.replaceChildren(...body);
  renderHeader();
  requestAnimationFrame(drawAll);
}

function renderEmpty(err) {
  return card("No bot data yet", null,
    h("p", { class: "muted", text: "This page reads files the bot publishes to the “" + CONFIG.dataBranch + "” branch of " + CONFIG.owner + "/" + CONFIG.repo + ". That branch is created the first time the bot runs." }),
    h("ol", { class: "rules" },
      h("li", { text: "Check that bot.py, strategies.py, publisher.py and the workflow file in your repo are the newest versions." }),
      h("li", { text: "Open the repo's Actions tab, choose Trading Bot, and press Run workflow." }),
      h("li", { text: "When the run finishes, come back here and press Refresh." })),
    h("p", { class: "small muted", style: "margin-top:12px", text: "Technical detail: " + err.message }),
    h("div", { style: "margin-top:12px" }, h("button", { class: "btn", type: "button", onclick: () => setDemo(true) }, "Preview with sample data")));
}

let demoCache = null;
function fixView() {
  if (!model) return;
  const ids = model.strategies.map((s) => s.id);
  if (ui.view === "compare" ? ids.length < 2 : !ids.includes(ui.view)) ui.view = ids.length > 1 ? "compare" : ids[0];
}
async function refresh() {
  if (inflight) return;
  inflight = true;
  app.classList.add("loading");
  try {
    if (ui.demo) { demoCache = demoCache || makeDemo(); model = demoCache; model.loadedAt = Date.now(); lastError = null; }
    else { model = await loadLive(); lastError = null; }
    fixView();
  } catch (e) {
    lastError = e;
    if (!model || model.demo) model = null;
  } finally {
    inflight = false;
    app.classList.remove("loading");
  }
  render();
}
function setDemo(on) { ui.demo = on; model = null; lastError = null; render(); refresh(); }
function setView(id) {
  if (id === ui.view) return;
  ui.view = id; store.set("view", id);
  renderHeader();
  if (ui.demo) render(); else refresh();
}
function applyTheme() {
  const root = document.documentElement;
  if (ui.theme === "auto") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", ui.theme);
}

$("#refresh").addEventListener("click", refresh);
$("#auto").addEventListener("click", () => { ui.auto = !ui.auto; store.set("auto", ui.auto ? "on" : "off"); renderHeader(); });
$("#demo").addEventListener("click", () => setDemo(!ui.demo));
$("#theme").addEventListener("click", () => { ui.theme = ui.theme === "auto" ? "light" : ui.theme === "light" ? "dark" : "auto"; store.set("theme", ui.theme); applyTheme(); renderHeader(); requestAnimationFrame(drawAll); });

let resizeTimer = null, lastW = 0;
new ResizeObserver(() => {
  const w = app.clientWidth;
  if (w === lastW) return;
  lastW = w;
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(drawAll, 120);
}).observe(app);

setInterval(() => {
  if (!model) return;
  updateAgo();
  if (ui.auto && !ui.demo && !document.hidden && Date.now() - model.loadedAt >= CONFIG.refreshSeconds * 1000) refresh();
}, 5000);

applyTheme();
refresh();
})();
</script>
</body>
</html>
